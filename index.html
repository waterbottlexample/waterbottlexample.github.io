<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading System...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 450px;
            padding: 2rem;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
        }
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #1e293b;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1rem;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #38bdf8;
            transition: width 0.4s ease;
        }
        .status-text {
            font-size: 0.875rem;
            color: #94a3b8;
            height: 1.5rem;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="spinner"></div>
        <h1 id="title">Initializing Secure Environment</h1>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status-text" id="statusText">Starting core services...</div>
    </div>

    <script>
        const statuses = [
            "Mounting virtual filesystem...",
            "Loading Laois GIS core libraries...",
            "Resolving dynamic node dependencies...",
            "Injecting WebGL asset shaders...",
            "Fetching Laois cryptographic certificates...",
            "Optimizing garbage collection pipeline...",
            "Synchronizing distributed node cache...",
            "Verifying kernel module integrity...",
            "Allocating memory buffers...",
            "Handshaking with proxy gateway..."
        ];

        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const title = document.getElementById('title');

        let progress = 0;
        let statusIndex = 0;

        // Cycle through status messages randomly or sequentially
        const statusInterval = setInterval(() => {
            statusIndex = (statusIndex + 1) % statuses.length;
            statusText.textContent = statuses[statusIndex];
        }, 2200);

        // Progress simulation that slows down significantly near 99% to look permanently stuck
        const loadInterval = setInterval(() => {
            if (progress < 92) {
                progress += Math.floor(Math.random() * 4) + 1;
            } else if (progress < 99) {
                // Crawl very slowly at the end
                progress += Math.random() > 0.6 ? 1 : 0;
            } else {
                // Gets stuck at 99% forever
                progress = 99;
                title.textContent = "Almost there (Optimizing final assets)...";
                clearInterval(loadInterval);
            }
            progressBar.style.width = progress + '%';
        }, 300);
    </script>
</body>
</html>
